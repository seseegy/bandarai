name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Dibutuhkan untuk membuat tag & release (token bawaan bisa read-only).
permissions:
  contents: write

# Build baru di branch/PR yang sama membatalkan build lama yang masih jalan.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Cek kode (analyze + test)
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      # Binary idx (16 MB) tidak bisa masuk repo sebagai file biner lewat
      # konektor GitHub (khusus teks), jadi di repo ia tersimpan sebagai
      # potongan-potongan base64 teks di folder idx-bin/ dan dirakit di sini,
      # lalu diverifikasi sha256-nya sebelum build.
      - name: Rakit binary idx (libidx.so) dari potongan base64
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cat idx-bin/libidx.so.b64.* | base64 -d > android/app/src/main/jniLibs/arm64-v8a/libidx.so
          echo "$(cat idx-bin/SHA256.txt)  android/app/src/main/jniLibs/arm64-v8a/libidx.so" | sha256sum -c -
          ls -la android/app/src/main/jniLibs/arm64-v8a/libidx.so

      - name: Siapkan keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secret keystore tidak ada — APK ditandatangani kunci debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/bandarai-release.keystore
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/bandarai-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=bandarai
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandarai-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      # Release hanya untuk push ke main (bukan PR / jalankan manual di branch lain).
      - name: Terbitkan release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-*-release.apk
